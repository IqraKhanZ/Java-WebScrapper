<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Web Scraper | Full-Stack Content Extractor</title>
    <!-- Tailwind CSS for sleek, modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React 18 and Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- React Root Container -->
    <div id="root"></div>

    <!-- React Application Script -->
    <script type="text/babel">
        const { useState } = React;

        // ========================================================
        // 1. Navigation Bar Component
        // ========================================================
        function Navbar() {
            return (
                <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                    <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                <i className="fa-solid fa-spider text-lg"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-slate-900 tracking-tight leading-none">
                                    Java Web Scraper
                                </h1>
                                <p className="text-xs text-slate-500 font-medium">Spring Boot &bull; Jsoup &bull; React</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <span className="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
                                <i className="fa-solid fa-code text-indigo-500 mr-1.5"></i> By Iqra Khan
                            </span>
                            <a 
                                href="https://github.com/IqraKhanZ/Java-WebScrapper" 
                                target="_blank" 
                                rel="noreferrer"
                                className="flex items-center space-x-2 text-sm text-slate-600 hover:text-indigo-600 font-medium transition-colors px-3 py-1.5 rounded-lg hover:bg-slate-100"
                            >
                                <i className="fa-brands fa-github text-lg"></i>
                                <span className="hidden md:inline">GitHub</span>
                            </a>
                        </div>
                    </div>
                </nav>
            );
        }

        // ========================================================
        // 2. Metrics / Stat Cards Component
        // ========================================================
        function StatsSummary({ data }) {
            const stats = [
                { label: 'Images Found', value: data.totalImages || 0, icon: 'fa-image', color: 'from-blue-500 to-cyan-500' },
                { label: 'Videos Found', value: data.totalVideos || 0, icon: 'fa-video', color: 'from-purple-500 to-pink-500' },
                { label: 'Links Extracted', value: data.totalLinks || 0, icon: 'fa-link', color: 'from-emerald-500 to-teal-500' },
            ];

            return (
                <div className="mt-8">
                    <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm mb-6">
                        <div className="flex items-start space-x-3">
                            <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5">
                                <i className="fa-solid fa-globe text-sm"></i>
                            </div>
                            <div className="min-w-0">
                                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Target Page Title</p>
                                <h3 className="text-lg font-bold text-slate-800 truncate">{data.title || "Untitled Page"}</h3>
                                <p className="text-xs text-indigo-600 truncate mt-0.5 font-medium">{data.url}</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        {stats.map((s, idx) => (
                            <div key={idx} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center space-x-4">
                                <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${s.color} text-white flex items-center justify-center text-xl shadow-md`}>
                                    <i className={`fa-solid ${s.icon}`}></i>
                                </div>
                                <div>
                                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">{s.label}</p>
                                    <h4 className="text-2xl font-black text-slate-800">{s.value}</h4>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ========================================================
        // 3. Images Tab Component
        // ========================================================
        function ImagesList({ images }) {
            if (!images || images.length === 0) {
                return (
                    <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                        <i className="fa-regular fa-image text-4xl text-slate-300 mb-3"></i>
                        <p className="text-slate-500 font-medium">No images detected on this page.</p>
                    </div>
                );
            }

            return (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    {images.map((img, i) => (
                        <div key={i} className="group relative bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col">
                            <div className="aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
                                <img 
                                    src={img} 
                                    alt={`Scraped asset ${i + 1}`}
                                    className="object-cover w-full h-full group-hover:scale-105 transition-transform duration-300"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src = "https://placehold.co/300x300?text=Preview+Unavailable";
                                    }}
                                />
                            </div>
                            <div className="p-2.5 bg-white flex items-center justify-between border-t border-slate-100">
                                <span className="text-xs text-slate-400 font-mono">#{i + 1}</span>
                                <a 
                                    href={img} 
                                    target="_blank" 
                                    rel="noreferrer" 
                                    className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1"
                                >
                                    <span>View</span>
                                    <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ========================================================
        // 4. Videos Tab Component
        // ========================================================
        function VideosList({ videos }) {
            if (!videos || videos.length === 0) {
                return (
                    <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                        <i className="fa-regular fa-circle-play text-4xl text-slate-300 mb-3"></i>
                        <p className="text-slate-500 font-medium">No direct video files detected on this page.</p>
                    </div>
                );
            }

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {videos.map((vid, i) => (
                        <div key={i} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                            <video src={vid} controls className="w-full bg-black aspect-video"></video>
                            <div className="p-3 bg-white flex items-center justify-between border-t border-slate-100">
                                <span className="text-xs text-slate-500 truncate mr-2 font-mono">{vid}</span>
                                <a 
                                    href={vid} 
                                    target="_blank" 
                                    rel="noreferrer" 
                                    className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 shrink-0"
                                >
                                    Open Direct
                                </a>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ========================================================
        // 5. Links Tab Component
        // ========================================================
        function LinksList({ links }) {
            const [filter, setFilter] = useState('');
            const [copiedIndex, setCopiedIndex] = useState(null);

            if (!links || links.length === 0) {
                return (
                    <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                        <i className="fa-solid fa-link text-4xl text-slate-300 mb-3"></i>
                        <p className="text-slate-500 font-medium">No hyperlinks found on this page.</p>
                    </div>
                );
            }

            const filteredLinks = links.filter(l => l.toLowerCase().includes(filter.toLowerCase()));

            const handleCopy = (link, idx) => {
                navigator.clipboard.writeText(link);
                setCopiedIndex(idx);
                setTimeout(() => setCopiedIndex(null), 2000);
            };

            return (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <span className="text-xs font-bold text-slate-600 uppercase tracking-wider">
                            Showing {filteredLinks.length} of {links.length} Links
                        </span>
                        <div className="relative w-full sm:w-72">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input 
                                type="text"
                                value={filter}
                                onChange={(e) => setFilter(e.target.value)}
                                placeholder="Filter links..."
                                className="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                    </div>
                    <div className="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">
                        {filteredLinks.map((link, idx) => (
                            <div key={idx} className="p-3 hover:bg-slate-50 flex items-center justify-between gap-4 text-xs">
                                <a 
                                    href={link} 
                                    target="_blank" 
                                    rel="noreferrer" 
                                    className="text-slate-700 hover:text-indigo-600 font-medium truncate flex-1 flex items-center space-x-2"
                                >
                                    <i className="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
                                    <span className="truncate">{link}</span>
                                </a>
                                <button
                                    onClick={() => handleCopy(link, idx)}
                                    className="shrink-0 px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors font-medium text-[11px]"
                                    title="Copy link"
                                >
                                    {copiedIndex === idx ? (
                                        <span className="text-emerald-600 font-bold"><i className="fa-solid fa-check mr-1"></i> Copied</span>
                                    ) : (
                                        <span><i className="fa-regular fa-copy mr-1"></i> Copy</span>
                                    )}
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ========================================================
        // 6. Main App Component
        // ========================================================
        function App() {
            const [url, setUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [data, setData] = useState(null);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('images');

            const demoUrls = [
                { label: 'Wikipedia (India)', url: 'https://en.wikipedia.org/wiki/India' },
                { label: 'Hacker News', url: 'https://news.ycombinator.com' },
                { label: 'GitHub Explore', url: 'https://github.com/explore' },
            ];

            const handleScrape = async (e) => {
                if (e) e.preventDefault();
                if (!url.trim()) {
                    setError('Please enter a website URL.');
                    return;
                }

                setLoading(true);
                setError(null);
                setData(null);

                try {
                    const response = await fetch(`/api/scrape?url=${encodeURIComponent(url.trim())}`);
                    if (!response.ok) {
                        throw new Error(`Server responded with status ${response.status}`);
                    }
                    const result = await response.json();
                    
                    if (result.success === false) {
                        setError(result.message || 'Scraping failed.');
                    } else {
                        setData(result);
                        if (result.images && result.images.length > 0) {
                            setActiveTab('images');
                        } else if (result.links && result.links.length > 0) {
                            setActiveTab('links');
                        }
                    }
                } catch (err) {
                    setError('Failed to reach backend server. Make sure Spring Boot is running on port 8181.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex-1 flex flex-col">
                    <Navbar />

                    <main className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
                        <div className="text-center max-w-2xl mx-auto mb-8">
                            <span className="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-violet-100 text-violet-700 mb-3">
                                Fast &bull; Clean &bull; Full-Stack Extractor
                            </span>
                            <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                                Web Content Extractor
                            </h2>
                            <p className="mt-2 text-sm sm:text-base text-slate-600">
                                Enter any website address to inspect and extract all hosted images, media clips, and hyperlinks in real time.
                            </p>

                            <div className="mt-4 flex flex-wrap items-center justify-center gap-2">
                                <span className="text-xs text-slate-400 font-medium">Try an example:</span>
                                {demoUrls.map((demo, idx) => (
                                    <button 
                                        key={idx}
                                        type="button"
                                        onClick={() => { setUrl(demo.url); }}
                                        className="text-xs px-2.5 py-1 rounded-full bg-slate-200/70 hover:bg-slate-300 text-slate-700 font-medium transition-colors"
                                    >
                                        {demo.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="max-w-3xl mx-auto">
                            <form onSubmit={handleScrape} className="glass-card rounded-2xl p-3 shadow-lg shadow-slate-200/50">
                                <div className="flex flex-col sm:flex-row items-center gap-2">
                                    <div className="relative flex-1 w-full">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i className="fa-solid fa-link text-sm"></i>
                                        </div>
                                        <input
                                            type="text"
                                            value={url}
                                            onChange={(e) => setUrl(e.target.value)}
                                            placeholder="Enter target URL (e.g., https://example.com)"
                                            className="w-full pl-10 pr-10 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"
                                        />
                                        {url && (
                                            <button 
                                                type="button" 
                                                onClick={() => setUrl('')}
                                                className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                                            >
                                                <i className="fa-solid fa-xmark text-sm"></i>
                                            </button>
                                        )}
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className={`w-full sm:w-auto px-6 py-3 rounded-xl font-semibold text-sm text-white shadow-md transition-all flex items-center justify-center space-x-2 shrink-0 ${
                                            loading 
                                                ? 'bg-indigo-400 cursor-not-allowed' 
                                                : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] shadow-indigo-200'
                                        }`}
                                    >
                                        {loading ? (
                                            <>
                                                <i className="fa-solid fa-spinner fa-spin text-sm"></i>
                                                <span>Scraping...</span>
                                            </>
                                        ) : (
                                            <>
                                                <i className="fa-solid fa-magnifying-glass text-sm"></i>
                                                <span>Scrape Website</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>

                            {error && (
                                <div className="mt-4 p-4 rounded-xl bg-red-50 border border-red-200 flex items-start space-x-3 text-red-800 text-sm">
                                    <i className="fa-solid fa-circle-exclamation text-red-500 text-base mt-0.5"></i>
                                    <div>
                                        <p className="font-semibold">Unable to scrape</p>
                                        <p className="text-xs text-red-700 mt-0.5">{error}</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {data && (
                            <div className="mt-6">
                                <StatsSummary data={data} />

                                <div className="flex border-b border-slate-200 mt-8 mb-6 space-x-2">
                                    <button
                                        onClick={() => setActiveTab('images')}
                                        className={`pb-3 px-4 text-sm font-semibold border-b-2 transition-all flex items-center space-x-2 ${
                                            activeTab === 'images'
                                                ? 'border-indigo-600 text-indigo-600'
                                                : 'border-transparent text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        <i className="fa-regular fa-image"></i>
                                        <span>Images</span>
                                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600">
                                            {data.totalImages || 0}
                                        </span>
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('videos')}
                                        className={`pb-3 px-4 text-sm font-semibold border-b-2 transition-all flex items-center space-x-2 ${
                                            activeTab === 'videos'
                                                ? 'border-indigo-600 text-indigo-600'
                                                : 'border-transparent text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        <i className="fa-solid fa-video"></i>
                                        <span>Videos</span>
                                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600">
                                            {data.totalVideos || 0}
                                        </span>
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('links')}
                                        className={`pb-3 px-4 text-sm font-semibold border-b-2 transition-all flex items-center space-x-2 ${
                                            activeTab === 'links'
                                                ? 'border-indigo-600 text-indigo-600'
                                                : 'border-transparent text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        <i className="fa-solid fa-link"></i>
                                        <span>Links</span>
                                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600">
                                            {data.totalLinks || 0}
                                        </span>
                                    </button>
                                </div>

                                <div>
                                    {activeTab === 'images' && <ImagesList images={data.images} />}
                                    {activeTab === 'videos' && <VideosList videos={data.videos} />}
                                    {activeTab === 'links' && <LinksList links={data.links} />}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <p>
                                Developed by <span className="font-semibold text-slate-700">Iqra Khan</span> &bull; 
                                <a href="https://github.com/IqraKhanZ" target="_blank" rel="noreferrer" className="text-indigo-600 hover:underline ml-1">@IqraKhanZ</a>
                            </p>
                            <p className="text-slate-400">
                                Powered by Spring Boot 3 &bull; Jsoup &bull; React
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
